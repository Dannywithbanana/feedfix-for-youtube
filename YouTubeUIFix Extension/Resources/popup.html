<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedFix for YouTube</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="24" height="24" rx="6" fill="#FF0000"/>
      <path d="M9.5 15.5V8.5L16.5 12L9.5 15.5Z" fill="white"/>
    </svg>
    <span class="app-name">FeedFix</span>
  </div>

  <div class="section-title">Shorts</div>

  <label class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-label">Block Shorts</span>
      <span class="toggle-desc">Hides Shorts from the feed, sidebar &amp; search</span>
    </div>
    <span class="switch">
      <input type="checkbox" id="toggle-shorts" />
      <span class="slider"></span>
    </span>
  </label>

  <label class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-label">Open Shorts in normal player</span>
      <span class="toggle-desc">Redirects /shorts/ links to the regular watch page</span>
    </div>
    <span class="switch">
      <input type="checkbox" id="toggle-redirect" />
      <span class="slider"></span>
    </span>
  </label>

  <div class="section-title">Feed</div>

  <label class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-label">Videos only</span>
      <span class="toggle-desc">Hides topic suggestions, community posts &amp; promo shelves</span>
    </div>
    <span class="switch">
      <input type="checkbox" id="toggle-videosonly" />
      <span class="slider"></span>
    </span>
  </label>

  <label class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-label">Ignore paid-promotion label</span>
      <span class="toggle-desc">Clicking the “Includes paid promotion” tag opens the video, not a help page</span>
    </div>
    <span class="switch">
      <input type="checkbox" id="toggle-promo" />
      <span class="slider"></span>
    </span>
  </label>

  <div class="section-title">Layout</div>

  <div class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-label">Videos per row</span>
      <span class="toggle-desc">Auto lets YouTube decide</span>
    </div>
  </div>
  <div class="segmented" id="cols-picker" role="group" aria-label="Videos per row">
    <button data-cols="0">Auto</button>
    <button data-cols="3">3</button>
    <button data-cols="4">4</button>
    <button data-cols="5">5</button>
    <button data-cols="6">6</button>
  </div>

  <label class="toggle-row">
    <div class="toggle-info">
      <span class="toggle-label">Full-width feed</span>
      <span class="toggle-desc">Stretches the video grid across the whole page</span>
    </div>
    <span class="switch">
      <input type="checkbox" id="toggle-fullwidth" />
      <span class="slider"></span>
    </span>
  </label>

  <div class="footer">Active on youtube.com · changes apply instantly</div>

  <script src="popup.js"></script>
</body>
</html>
